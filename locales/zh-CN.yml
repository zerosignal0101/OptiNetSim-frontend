# units.yml (简体中文)
units:
  power:
    dbm: dBm
    mw: mW
  length:
    km: 公里
    m: 米
    cm: 厘米
    mm: 毫米
  speed:
    gbps: Gbps # 也可以直接使用 吉比特/秒
    mbps: Mbps
    kbps: Kbps
    bps: bps
  time:
    ps: 皮秒
    ns: 纳秒
    us: 微秒
    ms: 毫秒
    s: 秒
  frequency:
    thz: 太赫兹
    ghz: 吉赫兹
    mhz: 兆赫兹
    khz: 千赫兹
    hz: 赫兹
  wavelength:
    nm: 纳米
    um: 微米
  # ... 其他工程单位
