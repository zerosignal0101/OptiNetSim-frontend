actions:
  ok: 确定
  cancel: 取消
  save: 保存
  load: 加载
  apply: 应用
  close: 关闭
  reset: 重置
  confirm: 确认
  delete: 删除
  new: 新建
  open: 打开
  exit: 退出

status_bar:
  ready: 就绪
  loading: 加载中...
  saving: 保存中...
  error: 错误：%{message}
  elements_selected: 已选中 %{count} 个元素 # 中文复数不需要额外处理

messages:
  save_changes_prompt: 关闭前是否保存更改？
  unsaved_changes_warning: 您有未保存的更改。关闭将丢失它们。

